name: "CLA Assistant"
on:
  # Record CLA signatures from PR comments; this workflow never checks out PR code.
  issue_comment: # zizmor: ignore[dangerous-triggers] Required for contributors to sign the CLA.
    types: [created]
  # Fork PRs require the base repository's token and remote signature-store secret.
  pull_request_target: # zizmor: ignore[dangerous-triggers] Only the pinned CLA action runs, with no checkout.
    branches: [main]
    types: [opened, closed, synchronize]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false
  queue: max # Preserve queued signatures when additional comments arrive.

jobs:
  ContributorLicenseAgreement:
    name: Check contributor license agreement
    if: >-
      github.event.repository.fork == false &&
      (github.event_name == 'pull_request_target' ||
       (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')))
    runs-on: ubuntu-latest
    permissions:
      actions: write # Rerun the previous failed CLA check after a contributor signs.
      contents: read
      pull-requests: write # Post CLA comments and lock the PR conversation after merge.
      statuses: write # Retain the permission documented by CLA Assistant v2.6.1.
    steps:
      - name: "CLA Assistant" # zizmor: ignore[archived-uses] Existing CLA integration retained intentionally.
        # Retained for compatibility with splunk/cla-agreement; upstream is archived.
        # v2.6.1 is pinned to a verified commit to prevent mutable-tag changes.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PAT_CLATOOL }}
        with:
          remote-organization-name: splunk
          remote-repository-name: cla-agreement
          branch: main
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/splunk/cla-agreement/blob/main/CLA.md
          allowlist: dependabot[bot]
